name: Transport recovery checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transport-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dns-tls-pacing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: DNS parser and real TLS certificate tests
        run: bash tools/dns-validation/check.sh
      - name: Bounded timing jitter
        run: bash tools/dns-validation/check-pacer.sh
      - name: Patched pinned dnstt client tests
        run: bash tools/dns-validation/check-dnstt.sh
