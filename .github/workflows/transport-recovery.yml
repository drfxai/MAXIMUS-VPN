name: Transport recovery checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transport-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dns-tls-pacing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: DNS parser and real TLS certificate tests
        run: bash tools/dns-validation/check.sh
      - name: Bounded timing jitter
        run: bash tools/dns-validation/check-pacer.sh
      - name: Patched pinned dnstt client tests
        run: bash tools/dns-validation/check-dnstt.sh
