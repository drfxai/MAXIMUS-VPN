name: Transport recovery checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transport-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dns-tls-pacing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: DNS parser and real TLS certificate tests
        run: bash tools/dns-validation/check.sh
      - name: Bounded timing jitter
        run: bash tools/dns-validation/check-pacer.sh
      - name: Patched pinned dnstt client tests
        run: bash tools/dns-validation/check-dnstt.sh
