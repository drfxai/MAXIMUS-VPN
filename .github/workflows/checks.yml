name: Checks

# Tests used to run only when a release was built by hand, so a change could sit on a branch untested.
on:
  push:
    branches: ['**']
    paths-ignore: [docs/**, '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Restore environment configuration
        run: |
          [ -f .env ] || printf 'GEMINI_API_KEY=DEFAULT_API_KEY\n' > .env
          [ -f .env.example ] || printf 'GEMINI_API_KEY=DEFAULT_API_KEY\n' > .env.example
      - name: Fetch verified native Xray runtime
        run: bash scripts/fetch-libxray-android.sh
      - name: Unit tests
        env:
          MAXIMUS_SERVERLESS_FIXTURES: ${{ github.workspace }}/app/build/serverless-fixtures
          MAXIMUS_SINGBOX_FIXTURES: ${{ github.workspace }}/app/build/singbox-fixtures
        run: bash gradlew --no-daemon :app:testDebugUnitTest
      - name: Real sing-box traffic and certificate rejection
        run: python3 tools/singbox-validation/check.py --fixtures app/build/singbox-fixtures
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Real serverless schema, authentication and bidirectional traffic
        run: python3 tools/serverless-validation/check.py --fixtures app/build/serverless-fixtures
      - name: Lint
        run: bash gradlew --no-daemon :app:lintRelease
      - name: Keep the test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore

  tools:
    name: Aggregator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install cryptography
      - run: python3 -m unittest discover -s tools/aggregator/tests -v

  server-tools:
    name: Server tools build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24'
          cache: false
      - name: DNS installation lifecycle regressions
        run: python3 -m unittest discover -s tools/server-tools/tests -v
      - name: Experimental DNS gateway unit and race tests
        working-directory: tools/dns-gateway
        run: go test -race ./...
      - name: SOCKS helper tests
        working-directory: tools/server-tools/socks
        run: GOTOOLCHAIN=go1.26.8 go test ./...
      - name: Reproducible build matches the pinned hashes
        run: bash scripts/server-tools/build.sh

  slipstream:
    name: Slipstream tunnel self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install -y cmake ninja-build pkg-config build-essential perl
      - name: Build slipstream-client and slipstream-server from pinned sources
        run: HOST=1 OUT=build/slipstream-host bash scripts/engines/slipstream.sh
      - name: Carry real traffic both ways through the tunnel
        run: python3 scripts/engines/slipstream-selftest.py --dir build/slipstream-host

  bot:
    name: Telegram bot tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node tools/telegram-bot/test.mjs

  secrets:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan the tree
        run: python3 scripts/check-repo-hygiene.py
