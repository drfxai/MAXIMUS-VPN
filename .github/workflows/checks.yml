name: Checks

# Tests used to run only when a release was built by hand, so a change could sit on a branch untested.
on:
  push:
    branches: ['**']
    paths-ignore: [docs/**, '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Restore environment configuration
        run: |
          [ -f .env ] || printf 'GEMINI_API_KEY=DEFAULT_API_KEY\n' > .env
          [ -f .env.example ] || printf 'GEMINI_API_KEY=DEFAULT_API_KEY\n' > .env.example
      - name: Fetch verified native Xray runtime
        run: bash scripts/fetch-libxray-android.sh
      - name: Unit tests
        run: bash gradlew --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: bash gradlew --no-daemon :app:lintRelease
      - name: Keep the test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore

  tools:
    name: Aggregator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cryptography
      - run: python3 -m unittest discover -s tools/aggregator/tests -v

  bot:
    name: Telegram bot tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/telegram-bot/test.mjs

  secrets:
    name: No committed secrets or assistant names
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan the tree
        run: python3 scripts/check-repo-hygiene.py
