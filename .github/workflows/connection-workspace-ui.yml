name: Connection workspace UI

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/example/ui/**'
      - 'scripts/capture-connection-workspaces.py'
      - '.github/workflows/connection-workspace-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connection-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Restore nonsecret build configuration
        run: |
          [ -f .env ] || printf 'GEMINI_API_KEY=DEFAULT_API_KEY\n' > .env
          [ -f .env.example ] || printf 'GEMINI_API_KEY=DEFAULT_API_KEY\n' > .env.example

      - name: Prepare verified native Xray runtime
        run: bash scripts/fetch-libxray-android.sh

      - name: Build the proposed UI
        run: bash gradlew --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Navigate connection workspaces in both themes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture-connection-workspaces.py

      - name: Save raw screenshots as downloadable run artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connection-workspace-screenshots
          path: app/build/workspace-captures/
          if-no-files-found: warn
