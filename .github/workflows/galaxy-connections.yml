name: Galaxy connection engines
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galaxy-engines-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native engines (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libclang-dev pkg-config
          sdkmanager=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f -print -quit)
          "$sdkmanager" 'ndk;26.3.11579264'
          echo 'ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/26.3.11579264' >> "$GITHUB_ENV"
      - name: Build pinned Aether and serverless runtimes
        env:
          ABI: ${{ matrix.abi }}
        run: |
          export OUT="$GITHUB_WORKSPACE/build/connection-engines/$ABI"
          bash scripts/engines/aether.sh
          bash scripts/engines/serverless.sh
          readelf -h "$OUT/libaether.so"
          readelf -h "$OUT/libserverless.so"
      - name: Keep engine programs and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: connection-engines-${{ matrix.abi }}
          path: |
            build/connection-engines/**
            build/transport-offer/*-source.tar.gz
