name: Go sidecar engines
# Compiles the pinned Go sidecars (Psiphon, Tor's lyrebird, usque, Mihomo) when their build scripts change,
# so an engine bump is proven to build for Android before it reaches a release.
on:
  pull_request:
    paths:
      - 'scripts/engines/psiphon.sh'
      - 'scripts/engines/lyrebird.sh'
      - 'scripts/engines/usque.sh'
      - 'scripts/engines/mihomo.sh'
      - 'scripts/engines/common.sh'
      - '.github/workflows/go-engines.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-engines-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.engine }} (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [psiphon, lyrebird, usque, mihomo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install Android NDK
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_bin"
          "$sdkmanager_bin" 'ndk;26.3.11579264'
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Compile the pinned engine
        env:
          ABI: arm64-v8a
          OUT: build/go-engines
          ENGINE: ${{ matrix.engine }}
        run: |
          bash "scripts/engines/$ENGINE.sh"
          readelf -h "build/go-engines/lib$ENGINE.so" | grep -q 'AArch64'
          readelf -h "build/go-engines/lib$ENGINE.so" | grep -Eq 'DYN|EXEC'
