name: AmneziaWG Android
on:
  pull_request:
    paths:
      - 'scripts/engines/amneziawg.sh'
      - 'scripts/engines/common.sh'
      - 'scripts/check-apk.py'
      - '.github/workflows/amneziawg-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install Android NDK
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_bin"
          "$sdkmanager_bin" 'ndk;26.3.11579264'
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Compile and inspect pinned AmneziaWG
        env:
          ABI: ${{ matrix.abi }}
          OUT: build/amneziawg
        run: |
          bash scripts/engines/amneziawg.sh
          python3 - "$ABI" <<'PY'
          from pathlib import Path
          import sys

          expected = {"arm64-v8a": (2, 183), "armeabi-v7a": (1, 40), "x86_64": (2, 62)}
          with Path("build/amneziawg/libamneziawg.so").open("rb") as binary:
              header = binary.read(20)
          assert header[:4] == b"\x7fELF"
          assert int.from_bytes(header[16:18], "little") == 3, "Expected an Android PIE"
          assert (header[4], int.from_bytes(header[18:20], "little")) == expected[sys.argv[1]]
          PY
