name: Radiance Android
on:
  pull_request:
    paths:
      - 'scripts/radiance/**'
      - '.github/workflows/radiance-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install Android NDK
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_bin"
          "$sdkmanager_bin" 'ndk;26.3.11579264'
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Compile pinned Radiance
        env:
          ABI: ${{ matrix.abi }}
          OUT: build/radiance
          RADIANCE_SOURCE_OFFER: build/radiance
        run: |
          bash scripts/radiance/build-android.sh
          readelf -h build/radiance/libradiance.so
          readelf -h build/radiance/libradiance.so | grep -q 'DYN'
          ! readelf -d build/radiance/libradiance.so | grep -q 'libc++_shared'
          if [ "$ABI" = arm64-v8a ]; then
            test -s build/radiance/Radiance-source.tar.gz
          fi
