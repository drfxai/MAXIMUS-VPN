name: Repository screenshots (real Android emulator)

on:
  push:
    branches: [main]
    paths:
      - scripts/capture-smart-psiphon.py
      - .github/workflows/repository-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Restore nonsecret build configuration
        run: |
          [ -f .env ] || printf 'GEMINI_API_KEY=DEFAULT_API_KEY\n' > .env
          [ -f .env.example ] || printf 'GEMINI_API_KEY=DEFAULT_API_KEY\n' > .env.example

      - name: Prepare verified native Xray runtime
        run: bash scripts/fetch-libxray-android.sh

      - name: Build app from current main for real UI screenshots
        run: bash gradlew --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture real Smart Manager and Psiphon Server screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture-smart-psiphon.py

      - name: Save raw screenshots as downloadable run artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-psiphon-real-screenshots
          path: |
            docs/media/screenshots/smart-manager.png
            docs/media/screenshots/psiphon-server.png
            docs/media/screenshots/capture-smart-psiphon.json
            docs/media/screenshots/capture-smart-psiphon-failure.png
          if-no-files-found: warn

      - name: Save verified raw capture in GitHub repository
        run: |
          test -s docs/media/screenshots/smart-manager.png
          test -s docs/media/screenshots/psiphon-server.png
          test -s docs/media/screenshots/capture-smart-psiphon.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media/screenshots/smart-manager.png docs/media/screenshots/psiphon-server.png docs/media/screenshots/capture-smart-psiphon.json
          if ! git diff --cached --quiet; then
            git commit -m 'Capture real Smart Manager and Psiphon Server on Android emulator'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
