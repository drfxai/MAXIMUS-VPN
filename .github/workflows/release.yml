name: Signed Android release

on:
  push:
    branches: [main]
    paths: [release-version.txt, release-request.txt]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example V1.0.1); must match release-version.txt
        required: true

permissions:
  contents: write
  # Build provenance for the APKs (gh attestation verify).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Read the release version
        # release-version.txt (for example V1.0.1) names the tag, the APK files and the release title; the app's
        # versionName must match it, so a release never ships a build that reports another version.
        run: |
          V=$(tr -d '[:space:]' < release-version.txt)
          case "$V" in V[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Bad release-version.txt: $V"; exit 1 ;; esac
          grep -q "versionName = \"${V#V}\"" app/build.gradle.kts || { echo "versionName does not match $V"; exit 1; }
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing RELEASE_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Restore environment configuration
        run: |
          if [ ! -f .env.example ]; then
            printf 'GEMINI_API_KEY=DEFAULT_API_KEY\n' > .env.example
          fi
          if [ ! -f .env ]; then
            printf 'GEMINI_API_KEY=DEFAULT_API_KEY\n' > .env
          fi
          sed -i -E 's/^GEMINI_API_KEY=(""?|)$/GEMINI_API_KEY=DEFAULT_API_KEY/' .env .env.example 2>/dev/null || true
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Fetch verified native Xray runtime
        run: bash scripts/fetch-libxray-android.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Psiphon network settings
        # Issued to this app by Psiphon Inc. and kept only as a repository secret; without it the
        # Psiphon engine is built but reports that its settings are missing.
        env:
          PSIPHON_CONFIG: ${{ secrets.PSIPHON_CONFIG }}
        run: |
          if [ -n "$PSIPHON_CONFIG" ]; then
            mkdir -p app/src/main/assets/psiphon
            printf '%s' "$PSIPHON_CONFIG" > app/src/main/assets/psiphon/config.json
            python3 -c 'import json; json.load(open("app/src/main/assets/psiphon/config.json"))'
            echo "Psiphon settings included"
          else
            echo "No PSIPHON_CONFIG secret; Psiphon stays off in this build"
          fi
      - name: Free config list key
        # The app checks the free list's signature with the public half of HUB_SIGNING_KEY. Only the
        # public key goes into the build; the private key stays in the secret.
        env:
          HUB_SIGNING_KEY: ${{ secrets.HUB_SIGNING_KEY }}
        run: |
          if [ -n "$HUB_SIGNING_KEY" ]; then
            public=$(printf '%s\n' "$HUB_SIGNING_KEY" | openssl ec -pubout -outform DER 2>/dev/null | base64 -w0)
            test -n "$public"
            echo "HUB_PUBLIC_KEY=$public" >> "$GITHUB_ENV"
            echo "Free config list enabled"
          else
            echo "No HUB_SIGNING_KEY secret; the free config list stays off in this build"
          fi
      - name: Official subscription key and mirrors
        # Repository variables (not secrets: both are public). OFFICIAL_PUBLIC_KEY is the public half of the
        # Worker's OFFICIAL_SIGNING_KEY (DER, base64); with it the app accepts the official subscription only
        # when signed. OFFICIAL_MIRRORS lists independent copies (docs/SUBSCRIPTIONS.md).
        env:
          OFFICIAL_PUBLIC_KEY: ${{ vars.OFFICIAL_PUBLIC_KEY }}
          OFFICIAL_MIRRORS: ${{ vars.OFFICIAL_MIRRORS }}
        run: |
          if [ -n "$OFFICIAL_PUBLIC_KEY" ]; then
            printf '%s' "$OFFICIAL_PUBLIC_KEY" | base64 -d | openssl pkey -pubin -inform DER -noout
            echo "OFFICIAL_PUBLIC_KEY=$OFFICIAL_PUBLIC_KEY" >> "$GITHUB_ENV"
            echo "Official subscription: signature required"
          else
            echo "No OFFICIAL_PUBLIC_KEY variable; the official subscription is accepted unsigned, as before"
          fi
          if [ -n "$OFFICIAL_MIRRORS" ]; then
            echo "OFFICIAL_MIRRORS=$OFFICIAL_MIRRORS" >> "$GITHUB_ENV"
            echo "Official subscription mirrors: $(printf '%s' "$OFFICIAL_MIRRORS" | tr ',' '\n' | grep -c .)"
          fi
      - name: Native transport build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_bin"
          "$sdkmanager_bin" 'ndk;26.3.11579264' 'cmake;3.22.1'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          libclang=$(find /usr/lib/llvm-* -name libclang.so -print -quit)
          test -n "$libclang"
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
      - name: Build the engine programs from pinned, checksum-verified sources
        # Every ABI is linked with the NDK's C toolchain (so DNS uses Android's resolver); the runner image has it.
        run: bash scripts/build-engines.sh arm64-v8a armeabi-v7a x86_64
      - name: Build, test and stage standalone APKs
        env:
          # The build number the in-app update pop-up compares; published with the release below.
          MAXIMUS_RELEASE_BUILD: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -s "$KEYSTORE_PATH"
          bash gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MAXIMUSVPN-${APP_VERSION}-universal.apk
          bash gradlew --no-daemon -PtargetAbi=arm64-v8a :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MAXIMUSVPN-${APP_VERSION}-arm64-v8a.apk
      - name: Verify packaging, signatures and checksums
        run: |
          python3 scripts/check-apk.py MAXIMUSVPN-${APP_VERSION}-arm64-v8a.apk arm64-v8a
          python3 scripts/check-apk.py MAXIMUSVPN-${APP_VERSION}-universal.apk universal
          for apk in MAXIMUSVPN-${APP_VERSION}-arm64-v8a.apk MAXIMUSVPN-${APP_VERSION}-universal.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
          sha256sum MAXIMUSVPN-${APP_VERSION}-arm64-v8a.apk MAXIMUSVPN-${APP_VERSION}-universal.apk > SHA256SUMS
          cp build/transport-offer/MatrixTransport-source.tar.gz MatrixTransport-source.tar.gz
          sha256sum MatrixTransport-source.tar.gz >> SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Check the permanent signing certificate
        # Users compare this fingerprint (SECURITY.md); a release signed with any other key stops here.
        env:
          EXPECTED_CERT_SHA256: 83352d116d4bb06fc9e8c5e6347633412da2197410fe45fdb48c1ad8e4a9dcfe
        run: |
          for apk in MAXIMUSVPN-${APP_VERSION}-arm64-v8a.apk MAXIMUSVPN-${APP_VERSION}-universal.apk; do
            got=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$got" = "$EXPECTED_CERT_SHA256" || { echo "$apk is signed with $got"; exit 1; }
          done
      - name: Remove the signing key
        # Nothing after this point signs; the key must not sit on disk while other actions run.
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Record build provenance
        if: ${{ !startsWith(inputs.tag, 'dry-run') }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            MAXIMUSVPN-${{ env.APP_VERSION }}-arm64-v8a.apk
            MAXIMUSVPN-${{ env.APP_VERSION }}-universal.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 install and launch checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            APP_PACKAGE=com.drfxai.maximusvpn bash scripts/install-smoke.sh MAXIMUSVPN-${APP_VERSION}-universal.apk
            echo "ARM64 APK was independently package/signature verified; launch testing requires a physical ARM64 device."
      - name: Preserve installation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-install-diagnostics
          path: /tmp/maximus-*.txt
      - name: Preserve verified APKs independently of release permissions
        uses: actions/upload-artifact@v4
        with:
          name: maximus-verified-apks
          path: |
            MAXIMUSVPN-${{ env.APP_VERSION }}-arm64-v8a.apk
            MAXIMUSVPN-${{ env.APP_VERSION }}-universal.apk
            SHA256SUMS
            build/transport-offer/MatrixTransport-source.tar.gz
          retention-days: 30
          if-no-files-found: error
      - name: Publish release
        # A test build (tag starting with "dry-run") checks everything above and publishes nothing.
        if: ${{ !startsWith(inputs.tag, 'dry-run') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          MAXIMUS_RELEASE_BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then RELEASE_TAG=$(cat release-version.txt); fi
          case "$RELEASE_TAG" in [vV][0-9]*.[0-9]*.[0-9]*) ;; *) echo 'Expected semver tag such as V1.0.0'; exit 1 ;; esac
          test "$RELEASE_TAG" = "$(cat release-version.txt)" || { echo 'Tag/version mismatch'; exit 1; }
          # Keep published downloads available while staging replacements.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Android version $RELEASE_TAG" --draft
          fi
          # The hidden maximus-build line is what the in-app update check reads.
          notes=$(printf 'Build %s\n\n<!-- maximus-build: %s -->' "$MAXIMUS_RELEASE_BUILD" "$MAXIMUS_RELEASE_BUILD")
          gh release upload "$RELEASE_TAG" MAXIMUSVPN-${APP_VERSION}-arm64-v8a.apk MAXIMUSVPN-${APP_VERSION}-universal.apk SHA256SUMS build/transport-offer/MatrixTransport-source.tar.gz --clobber
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi
          gh release edit "$RELEASE_TAG" --title "Android version $RELEASE_TAG" --notes "$notes" --draft=false --prerelease=false --latest
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort | join(",")')"
          test "$actual" = "MAXIMUSVPN-${APP_VERSION}-arm64-v8a.apk,MAXIMUSVPN-${APP_VERSION}-universal.apk,MatrixTransport-source.tar.gz,SHA256SUMS" || { echo "Unexpected assets: $actual"; exit 1; }
          echo 'Published APKs, checksums and the native transport corresponding-source archive.'
      - name: Publish update information for the in-app update pop-up
        # update.json on the update-info branch is what the app reads through jsDelivr/Statically when
        # api.github.com is blocked. Written only after the release itself is published.
        if: ${{ !startsWith(inputs.tag, 'dry-run') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          MAXIMUS_RELEASE_BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then RELEASE_TAG=$(cat release-version.txt); fi
          dir="$RUNNER_TEMP/update-info"
          mkdir -p "$dir" && cd "$dir"
          python3 -c 'import json,sys; print(json.dumps({"version": sys.argv[1], "build": int(sys.argv[2]), "url": "https://github.com/" + sys.argv[3] + "/releases/tag/" + sys.argv[1]}))' \
            "$RELEASE_TAG" "$MAXIMUS_RELEASE_BUILD" "$GITHUB_REPOSITORY" > update.json
          cat update.json
          git init -q -b update-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -q -m "Update information: $RELEASE_TAG build $MAXIMUS_RELEASE_BUILD"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" update-info
