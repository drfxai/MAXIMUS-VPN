name: CottenDNS engine checks
on:
  push:
    branches: ['**']
    paths:
      - 'app/src/main/java/com/example/panels/servers/DnsServerScripts.kt'
      - 'scripts/engines/cottendns.sh'
      - 'scripts/engines/cotten-strict-dns.py'
      - 'scripts/engines/common.sh'
      - 'app/src/main/java/com/example/vpn/sidecar/CottenDnsSidecar.kt'
      - '.github/workflows/cotten-engine.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/example/panels/servers/DnsServerScripts.kt'
      - 'scripts/engines/cottendns.sh'
      - 'scripts/engines/cotten-strict-dns.py'
      - 'scripts/engines/common.sh'
      - 'app/src/main/java/com/example/vpn/sidecar/CottenDnsSidecar.kt'
      - '.github/workflows/cotten-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cotten-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upstream-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Fetch and verify the exact CottenDNS revision
        run: |
          revision=e50a43ef75ad10ae2ffbfa106d13c50de3e77624
          git init -q "$RUNNER_TEMP/cotten-source"
          git -C "$RUNNER_TEMP/cotten-source" fetch --depth=1 https://github.com/WhiteDNS/CottenDNS.git "$revision"
          git -C "$RUNNER_TEMP/cotten-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cotten-source" rev-parse HEAD)" = "$revision"
      - name: Configuration, client recovery and authenticated transfer tests
        working-directory: ${{ runner.temp }}/cotten-source
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/engines/cotten-strict-dns.py" .
          go mod download
          go mod verify
          go test -mod=readonly -count=1 -timeout 240s ./...
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build the pinned Android executable
        env:
          ABI: ${{ matrix.abi }}
          OUT: ${{ runner.temp }}/cotten-native
        run: |
          sdk_root=/usr/local/lib/android/sdk
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_bin"
          "$sdkmanager_bin" 'ndk;26.3.11579264'
          export ANDROID_NDK_HOME="$sdk_root/ndk/26.3.11579264"
          bash scripts/engines/cottendns.sh
          test -s "$OUT/libcottendns.so"
          readelf -h "$OUT/libcottendns.so"
      - uses: actions/upload-artifact@v4
        with:
          name: cotten-native-${{ matrix.abi }}
          path: ${{ runner.temp }}/cotten-native/libcottendns.so
          retention-days: 7
